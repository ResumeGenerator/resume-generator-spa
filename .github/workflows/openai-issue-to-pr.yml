name: OpenAI issue to PR

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number to implement
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  openai_issue_to_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve issue context
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            let issueNumber;
            if (context.eventName === 'workflow_dispatch') {
              issueNumber = Number(context.payload.inputs.issue_number);
            } else {
              issueNumber = context.payload.issue.number;
            }
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            core.setOutput('number', String(issue.number));
            core.setOutput('title', issue.title);
            core.setOutput('body', issue.body || '');
            core.setOutput('url', issue.html_url);
            core.setOutput('author', issue.user?.login || 'unknown');
            core.setOutput('branch', `openai/issue-${issue.number}-${context.runId}`);

      - name: Create working branch
        env:
          BRANCH_NAME: ${{ steps.issue.outputs.branch }}
        run: git switch -c "$BRANCH_NAME"

      - name: Generate OpenAI prompt
        run: |
          mkdir -p .github/openai/generated
          cat > .github/openai/generated/issue-prompt.md <<'EOF'
          You are GPT‑4.1 running in GitHub Actions for the resume-generator-spa repository.
          Implement the GitHub issue below as a complete, production-quality code change.
          ## Workflow
          1. Inspect relevant source files.
          2. Implement the smallest safe change.
          3. Preserve Angular 21 standalone component and signal patterns.
          4. Keep API calls centralized in src/app/services/resume-api.ts.
          5. Add/update tests when logic or UI changes.
          6. Run npm run build when feasible.
          7. Do not commit; workflow will handle commit/PR.
          ## PR expectations
          - What changed
          - What validation was run
          - Any backend-dependent behavior not verified
          ## GitHub issue
          Issue: #${{ steps.issue.outputs.number }}
          Title: ${{ steps.issue.outputs.title }}
          Author: @${{ steps.issue.outputs.author }}
          URL: ${{ steps.issue.outputs.url }}
          Body:
          ${{ steps.issue.outputs.body }}
          EOF

      - name: Call OpenAI GPT‑4.1
        id: run_openai
        run: |
          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
            -d '{
              "model": "gpt-4.1",
              "messages": [
                {"role": "system", "content": "You are GPT‑4.1 running in GitHub Actions."},
                {"role": "user", "content": "'"$(cat .github/openai/generated/issue-prompt.md)"'"}
              ]
            }')
          echo "$RESPONSE" > openai-output.json
          echo "final_message=$(jq -r '.choices[0].message.content' openai-output.json)" >> $GITHUB_OUTPUT

      - name: Detect changes
        id: changes
        run: |
          if git status --porcelain | grep .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        env:
          BRANCH_NAME: ${{ steps.issue.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Implement issue #${{ steps.issue.outputs.number }} with OpenAI GPT‑4.1"
          git push --set-upstream origin "$BRANCH_NAME"

      - name: Debug repo context
        run: |
          echo "Repo from context: ${{ github.repository }}"
          git remote -v

      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
          BRANCH_NAME: ${{ steps.issue.outputs.branch }}
          OPENAI_FINAL_MESSAGE: ${{ steps.run_openai.outputs.final_message }}
        run: |
          {
            echo "Implemented by OpenAI GPT‑4.1 from issue #${ISSUE_NUMBER}."
            echo
            echo "Closes #${ISSUE_NUMBER}"
            echo
            echo "Issue: ${ISSUE_URL}"
            echo
            echo "## OpenAI summary"
            echo
            if [ -n "$OPENAI_FINAL_MESSAGE" ]; then
              printf '%s\n' "$OPENAI_FINAL_MESSAGE"
            else
              echo "OpenAI did not return a final summary."
            fi
          } > pr-body.md
          gh pr create \
            --repo "${{ github.repository }}" \
            --head "$BRANCH_NAME" \
            --base "${{ github.event.repository.default_branch || 'main' }}" \
            --title "OpenAI: ${ISSUE_TITLE}" \
            --body-file pr-body.md

      - name: Comment when no changes were made
        if: steps.changes.outputs.has_changes == 'false'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          OPENAI_FINAL_MESSAGE: ${{ steps.run_openai.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = [
              'OpenAI GPT‑4.1 ran for this issue but did not produce any file changes.',
              '',
              process.env.OPENAI_FINAL_MESSAGE || 'No final OpenAI message was returned.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body,
            });
