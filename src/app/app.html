<header class="site-header">
  <div class="site-header-inner">
    <div class="header-leading">
      <a class="brand-link" routerLink="/" aria-label="CareerKit AI home">
        <span class="brand-mark" aria-hidden="true">
          <span></span>
          <span></span>
        </span>
        <span>CareerKit AI</span>
      </a>
    </div>

    <nav class="header-nav" aria-label="Main navigation">
      @if (authService.isAuthenticated()) {
        <div class="profile-menu">
          <button
            type="button"
            class="profile-button"
            [attr.aria-label]="isProfileOpen() ? 'Close account menu' : 'Open account menu'"
            [attr.aria-expanded]="isProfileOpen()"
            aria-controls="profile-menu-panel"
            (click)="toggleProfileMenu()"
          >
            <span class="profile-avatar" aria-hidden="true">{{ profileInitials() }}</span>
            <span class="profile-chevron" aria-hidden="true"></span>
          </button>

          @if (isProfileOpen()) {
            <div id="profile-menu-panel" class="profile-panel">
              <div class="profile-summary">
                <span class="profile-avatar large" aria-hidden="true">{{ profileInitials() }}</span>
                <div>
                  <strong>{{ profileName() }}</strong>
                  @if (profileEmail()) {
                    <span>{{ profileEmail() }}</span>
                  }
                </div>
              </div>
              <button type="button" class="profile-logout" (click)="logout()">Sign out</button>
            </div>
          }
        </div>
      } @else {
        <a class="primary-nav-link" routerLink="/login">Start Creating</a>
        <a class="login-nav-link" routerLink="/login">Sign In</a>
      }
    </nav>
  </div>
</header>

<router-outlet />
