<header class="site-header">
  <div class="site-header-inner">
    <div class="header-leading">
      <button
        type="button"
        class="menu-toggle"
        [attr.aria-label]="isMenuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
        aria-controls="main-navigation-menu"
        [attr.aria-expanded]="isMenuOpen()"
        (click)="toggleMenu()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <a class="brand-link" routerLink="/" aria-label="CareerKit AI home" (click)="closeMenu()">
        <span>CareerKit AI</span>
      </a>
    </div>

    <nav class="header-nav" aria-label="Main navigation">
      <a class="primary-nav-link" routerLink="/upload" (click)="closeMenu()">Start Creating</a>
      @if (authService.isAuthenticated()) {
        <button type="button" class="login-nav-link" (click)="logout()">Logout</button>
      } @else {
        <a class="login-nav-link" routerLink="/login" (click)="closeMenu()">Login</a>
      }
    </nav>

    @if (isMenuOpen()) {
      <nav id="main-navigation-menu" class="navigation-menu" aria-label="Menu navigation">
        <a routerLink="/" (click)="closeMenu()">Home</a>
        <a routerLink="/upload" (click)="closeMenu()">Document Workspace</a>
        @if (authService.isAuthenticated()) {
          <button type="button" (click)="logout()">Logout</button>
        } @else {
          <a routerLink="/login" (click)="closeMenu()">Login</a>
        }
      </nav>
    }
  </div>
</header>

<router-outlet />
